name: OBM tenant boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mt2test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: mt2_tenancy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mt2test -d mt2_tenancy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mt2test:test-only-ci-password@127.0.0.1:5432/mt2_tenancy_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
